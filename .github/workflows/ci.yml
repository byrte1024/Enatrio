name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run linter
        run: uv run --with tree-sitter --with tree-sitter-c python3 tools/lint.py src/

      - name: Run linter tests
        run: uv run --with tree-sitter --with tree-sitter-c python3 tools/test_lint.py

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        id: cache-apt
        with:
          path: ~/apt-cache
          key: apt-deps-${{ runner.os }}

      - name: Install dependencies
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y gcc make cmake git \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev \
            libxkbcommon-dev
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Cache raylib
        uses: actions/cache@v5
        id: cache-raylib
        with:
          path: lib/raylib/lib
          key: raylib-5.5-${{ runner.os }}

      - name: Build raylib from source
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git init /tmp/raylib-src
          cd /tmp/raylib-src
          git fetch --depth 1 https://github.com/raysan5/raylib.git c1ab645ca298a2801097931d1079b10ff7eb9df8
          git checkout FETCH_HEAD
          cd /tmp/raylib-src/src
          make PLATFORM=PLATFORM_DESKTOP -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/lib/raylib/lib
          cp libraylib.a $GITHUB_WORKSPACE/lib/raylib/lib/libraylib.a

      - name: Build debug
        run: bash ./build.sh debug

      - name: Build release
        run: bash ./build.sh release

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: enatrio-linux-debug
          path: build/debug/linux/

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: enatrio-linux-release
          path: build/release/linux/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make git

      - name: Cache raylib
        uses: actions/cache@v5
        id: cache-raylib-win
        with:
          path: lib/raylib/lib
          key: raylib-5.5-${{ runner.os }}

      - name: Build raylib from source
        if: steps.cache-raylib-win.outputs.cache-hit != 'true'
        run: |
          git init /tmp/raylib-src
          cd /tmp/raylib-src
          git fetch --depth 1 https://github.com/raysan5/raylib.git c1ab645ca298a2801097931d1079b10ff7eb9df8
          git checkout FETCH_HEAD
          cd /tmp/raylib-src/src
          make PLATFORM=PLATFORM_DESKTOP -j$(nproc)
          mkdir -p "$GITHUB_WORKSPACE/lib/raylib/lib"
          cp libraylib.a "$GITHUB_WORKSPACE/lib/raylib/lib/libraylib.a"

      - name: Build debug
        run: bash ./build.sh debug

      - name: Build release
        run: bash ./build.sh release

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: enatrio-windows-debug
          path: build/debug/windows/

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: enatrio-windows-release
          path: build/release/windows/

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        id: cache-apt
        with:
          path: ~/apt-cache
          key: apt-deps-${{ runner.os }}

      - name: Install dependencies
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y gcc make cmake git \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev \
            libxkbcommon-dev
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Cache raylib
        uses: actions/cache@v5
        id: cache-raylib
        with:
          path: lib/raylib/lib
          key: raylib-5.5-${{ runner.os }}

      - name: Build raylib from source
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git init /tmp/raylib-src
          cd /tmp/raylib-src
          git fetch --depth 1 https://github.com/raysan5/raylib.git c1ab645ca298a2801097931d1079b10ff7eb9df8
          git checkout FETCH_HEAD
          cd /tmp/raylib-src/src
          make PLATFORM=PLATFORM_DESKTOP -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/lib/raylib/lib
          cp libraylib.a $GITHUB_WORKSPACE/lib/raylib/lib/libraylib.a

      - name: Build tests
        run: bash ./build.sh tests --no-lint

      - name: Upload tests
        uses: actions/upload-artifact@v4
        with:
          name: enatrio-tests-linux
          path: build/tests/linux/

      - name: Run tests
        run: |
          OUTPUT=$(./build/tests/linux/Enatrio 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "FAIL"; then
            echo "::error::Tests failed"
            exit 1
          fi
          PASSED=$(echo "$OUTPUT" | grep -oP 'Results: \K[0-9]+(?=/)')
          TOTAL=$(echo "$OUTPUT" | grep -oP 'Results: [0-9]+/\K[0-9]+')
          if [ "$PASSED" != "$TOTAL" ]; then
            echo "::error::Not all tests passed ($PASSED/$TOTAL)"
            exit 1
          fi

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make git

      - name: Cache raylib
        uses: actions/cache@v5
        id: cache-raylib-win
        with:
          path: lib/raylib/lib
          key: raylib-5.5-${{ runner.os }}

      - name: Build raylib from source
        if: steps.cache-raylib-win.outputs.cache-hit != 'true'
        run: |
          git init /tmp/raylib-src
          cd /tmp/raylib-src
          git fetch --depth 1 https://github.com/raysan5/raylib.git c1ab645ca298a2801097931d1079b10ff7eb9df8
          git checkout FETCH_HEAD
          cd /tmp/raylib-src/src
          make PLATFORM=PLATFORM_DESKTOP -j$(nproc)
          mkdir -p "$GITHUB_WORKSPACE/lib/raylib/lib"
          cp libraylib.a "$GITHUB_WORKSPACE/lib/raylib/lib/libraylib.a"

      - name: Build tests
        run: bash ./build.sh tests --no-lint

      - name: Upload tests
        uses: actions/upload-artifact@v4
        with:
          name: enatrio-tests-windows
          path: build/tests/windows/

      - name: Run tests
        run: |
          OUTPUT=$(./build/tests/windows/Enatrio.exe 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "FAIL"; then
            echo "::error::Tests failed"
            exit 1
          fi
          PASSED=$(echo "$OUTPUT" | grep -oP 'Results: \K[0-9]+(?=/)')
          TOTAL=$(echo "$OUTPUT" | grep -oP 'Results: [0-9]+/\K[0-9]+')
          if [ "$PASSED" != "$TOTAL" ]; then
            echo "::error::Not all tests passed ($PASSED/$TOTAL)"
            exit 1
          fi
